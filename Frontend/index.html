
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Club Meeting Manager</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f5f9;
            color: #202b3c;
        }

        header {
            background: #183b56;
            color: white;
            padding: 28px 20px;
            text-align: center;
        }

        header h1 {
            margin: 0 0 8px;
        }

        header p {
            margin: 0;
            color: #dce8f1;
        }

        main {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 18px;
        }

        .panel {
            background: white;
            padding: 24px;
            margin-bottom: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 14px rgba(0, 0, 0, 0.06);
        }

        .panel h2 {
            margin-top: 0;
            color: #183b56;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .field.full {
            grid-column: 1 / -1;
        }

        label {
            font-weight: bold;
            font-size: 14px;
        }

        input,
        textarea {
            width: 100%;
            padding: 11px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font: inherit;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        input:focus,
        textarea:focus {
            outline: 2px solid #8bbce0;
            border-color: #3975a6;
        }

        .buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 18px;
        }

        button {
            border: 0;
            padding: 11px 16px;
            border-radius: 7px;
            cursor: pointer;
            font-weight: bold;
        }

        .primary {
            background: #176b50;
            color: white;
        }

        .secondary {
            background: #e2e8f0;
            color: #202b3c;
        }

        .edit {
            background: #dbeafe;
            color: #1d4ed8;
        }

        .delete {
            background: #fee2e2;
            color: #b91c1c;
        }

        .table-wrap {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 950px;
        }

        th,
        td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
            vertical-align: top;
        }

        th {
            background: #edf3f8;
            color: #183b56;
        }

        td .buttons {
            margin-top: 0;
        }

        #status {
            margin: 12px 0;
            font-weight: bold;
        }

        .error {
            color: #b91c1c;
        }

        .success {
            color: #176b50;
        }

        .muted {
            color: #64748b;
        }

        @media (max-width: 650px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .field.full {
                grid-column: auto;
            }

            .panel {
                padding: 17px;
            }
        }
    </style>

    <script src="app.js" defer></script>
</head>

<body>
    <header>
        <h1>Book Club Meeting Manager</h1>
        <p>Organise meetings, share ideas and explore great books.</p>
    </header>

    <main>
        <section class="panel">
            <h2 id="formTitle">Add a Book Club Meeting</h2>

            <form id="meetingForm">
                <div class="form-grid">
                    <div class="field">
                        <label for="book_title">Book Title</label>
                        <input id="book_title" name="book_title"
                               maxlength="200" required>
                    </div>

                    <div class="field">
                        <label for="facilitator">Facilitator</label>
                        <input id="facilitator" name="facilitator"
                               required>
                    </div>

                    <div class="field">
                        <label for="meeting_date">Meeting Date</label>
                        <input id="meeting_date" name="meeting_date"
                               type="date" required>
                    </div>

                    <div class="field">
                        <label for="meeting_time">Meeting Time</label>
                        <input id="meeting_time" name="meeting_time"
                               type="time" required>
                    </div>

                    <div class="field">
                        <label for="venue">Venue</label>
                        <input id="venue" name="venue" required>
                    </div>

                    <div class="field">
                        <label for="discussion_topic">Discussion Topic</label>
                        <input id="discussion_topic" name="discussion_topic"
                               required>
                    </div>

                    <div class="field full">
                        <label for="meeting_goal">Meeting Goal</label>
                        <textarea id="meeting_goal" name="meeting_goal"
                                  required></textarea>
                    </div>
                </div>

                <div class="buttons">
                    <button class="primary" type="submit" id="saveButton">
                        Add Meeting
                    </button>

                    <button class="secondary" type="button" id="cancelButton"
                            hidden>
                        Cancel Edit
                    </button>
                </div>
            </form>

            <p id="status" role="status" aria-live="polite"></p>
        </section>

        <section class="panel">
            <h2>Scheduled Book Club Meetings</h2>
            <p class="muted">
                View, update or remove meetings using the actions in the table.
            </p>

            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Book</th>
                            <th>Date</th>
                            <th>Time</th>
                            <th>Venue</th>
                            <th>Discussion</th>
                            <th>Facilitator</th>
                            <th>Goal</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody id="meetingsTable">
                        <tr>
                            <td colspan="9">Loading meetings...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>
</body>
</html>
